name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Install Dependencies
      working-directory: ./frontend
      run: npm install

    - name: Build Web Assets
      working-directory: ./frontend
      run: npm run build

    - name: Sync Capacitor
      working-directory: ./frontend
      run: |
        npx cap sync android > cap_sync.log 2>&1 || true
        cat cap_sync.log

    - name: Build APK
      working-directory: ./frontend/android
      run: |
        ./gradlew assembleDebug > gradle_build.log 2>&1 || true
        cat gradle_build.log

    - name: Upload Logs Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-logs
        path: |
          ./frontend/cap_sync.log
          ./frontend/android/gradle_build.log

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AEGIS-Offline-App
        path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
