# Deploy config for the Arabian Drops site.
#
# This folder is already the built site — there is no build command and no
# dependency install, so Netlify just publishes it as-is. Note that the repo root
# has its own netlify.toml for a different project; this file only applies when
# the Netlify site's base directory is set to `arabian-drops`.

[build]
  publish = "."
  command = ""

# Old links pointed at the current React app's client-side routes. Those 404 on a
# hard load today, so any that are out in the wild (ads, Google, WhatsApp shares)
# are dead. These rewrites make them resolve here instead.
[[redirects]]
  from = "/collection"
  to = "/collection.html"
  status = 200

[[redirects]]
  from = "/product/*"
  to = "/product.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/cart"
  to = "/collection.html"
  status = 302

[[redirects]]
  from = "/desktop.html"
  to = "/index.html"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The live site serves every asset with `Cache-Control: max-age=0, must-revalidate`,
# so a 1.42 MB logo is re-downloaded on each navigation. Images and CSS/JS are
# content-named or stable here, so they can be cached hard; HTML must not be.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
